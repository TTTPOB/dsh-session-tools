name: Session tools release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable source tag to publish
        required: true
        default: v0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: session-tools-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
      npm_config_verify_deps_before_run: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Validate tag and install pinned dependencies
        run: |
          test "$RELEASE_TAG" = "v$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')"
          pnpm install --frozen-lockfile
      - name: Build and test the consumer
        run: pnpm --config.verify-deps-before-run=false check
      - name: Verify packaged entry and create asset
        run: |
          node tests/pack-smoke.mjs
          pnpm --config.verify-deps-before-run=false pack --pack-destination dist/release
          (cd dist/release && sha256sum dsh-session-tools-*.tgz > SHA256SUMS)
      - name: Publish immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'Release already exists; refusing to overwrite.' >&2
            exit 1
          fi
          version=$(node -p 'JSON.parse(require("fs").readFileSync("package.json")).version')
          gh release create "$RELEASE_TAG" "dist/release/dsh-session-tools-$version.tgz" dist/release/SHA256SUMS --verify-tag --title "$RELEASE_TAG" --notes 'Shared Compact/Detail reading uses one fixed SessionObservation with bounded supplemental reads, processing and output budgets; explicit Raw preserves exact events and Unicode continuation. Indexed surface-aware search retains provider cursors, archived-session filtering and zero-I/O cached title hints without log-scan fallback. Adds the public current-Surface context-map library and session_context_map tool with bounded previews and optional metering. Requires Session core fork1 and capture-capable Query fork4 peers; development dependencies pin SQLite fork6 artifacts. Other DSH service peers remain rc.2. Installation and Host activation require separate authorization.'
